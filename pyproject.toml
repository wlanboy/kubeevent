[project]
name = "kubeevents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocron>=2.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "kubernetes>=37.0.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "watchdog>=7.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
