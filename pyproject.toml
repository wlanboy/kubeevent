[project]
name = "kubeevents"
version = "0.1.0"
description = "Real-time dashboard for collecting, storing and searching Kubernetes events"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.163.2",
    "jinja2>=3.1.6",
    "kubernetes>=37.0.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[project.scripts]
kubeevents = "kubeevents:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "watchdog>=7.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "G", "ASYNC", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["main.py", "kubeevents", "tests"]
