name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Automatisches Caching für installierte Pakete aktivieren
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Static Analysis (Linting)
        # Statt manueller compile-Befehle nutzen wir Ruff (extrem schnell)
        # Es prüft Syntax, Imports und Logikfehler in allen Dateien gleichzeitig
        run: uv run ruff check .

      - name: Verify FastAPI app imports
        # Wir nutzen Umgebungsvariablen, falls deine App beim Import DB-Configs braucht
        run: |
          uv run python -c "from main import app; print('🚀 FastAPI app imported successfully')"
