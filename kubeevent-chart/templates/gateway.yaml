apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.gatewayName }}
  labels:
    {{- include "kubeevent.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    {{- if .Values.istio.tls.enabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tls.secretName }}
    {{- end }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
