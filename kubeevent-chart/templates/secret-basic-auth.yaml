{{- if and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret) }}
{{- if not .Values.basicAuth.username }}
{{- fail "basicAuth.username fehlt" }}
{{- end }}
{{- if not (regexMatch "^\\$2[aby]\\$[0-9]{2}\\$.{53}$" (.Values.basicAuth.passwordHash | default "")) }}
{{- fail "basicAuth.passwordHash muss ein bcrypt-Hash sein ($2a$, $2b$ oder $2y$)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deploymentName }}-basic-auth
  labels:
    {{- include "kubeevent.labels" . | nindent 4 }}
type: Opaque
stringData:
  BASIC_AUTH_USER: {{ .Values.basicAuth.username | quote }}
  BASIC_AUTH_PASSWORD_HASH: {{ .Values.basicAuth.passwordHash | quote }}
{{- end }}
