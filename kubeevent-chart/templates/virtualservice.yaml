apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Values.deploymentName }}-vs
  labels:
    {{- include "kubeevent.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.hosts | nindent 4 }}
  # eigener Namespace für das Mesh, Gateway-Namespace für den Ingress
  exportTo:
    - "."
    - {{ .Values.istio.gatewayNamespace | quote }}
  gateways:
    - {{ .Values.istio.gatewayName }}
    - mesh
  http:
    - route:
        - destination:
            host: {{ .Values.service.name }}
            port:
              number: {{ .Values.service.port }}
