image:
  repository: wlanboy/kubeevent
  tag: latest
  pullPolicy: Always

# Mit persistence.enabled und ReadWriteOnce nur 1 Replica (SQLite)
replicaCount: 1
deploymentName: kubeevent

service:
  name: kubeevent-svc
  type: ClusterIP
  port: 5000
  targetPort: 5000

# Volume für die SQLite-Datenbank (DB_PATH = <mountPath>/events.db)
persistence:
  enabled: true
  claimName: kubeevent-data-pvc
  mountPath: /app/data
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  size: "100Mi"

# Ein uvicorn-Prozess. Gemessen (kind, 2 Namespaces): ~100Mi im Leerlauf, Spitze 112Mi unter Last, CPU 2m im Leerlauf
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# terminationGracePeriodSeconds = preStopSleepSeconds + appShutdownSeconds + 5
shutdown:
  # Zeit, bis Service-Endpoints und Istio den Pod nicht mehr ansprechen
  preStopSleepSeconds: 10
  # uvicorn --timeout-graceful-shutdown 10 plus 5 s Timeout der TaskGroup
  appShutdownSeconds: 15

probes:
  # bis zu 60 s für den Start (DB anlegen, Watcher starten)
  startup:
    periodSeconds: 2
    failureThreshold: 30
    timeoutSeconds: 2
  liveness:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readiness:
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 2

# /tmp als emptyDir, das Root-Dateisystem ist read-only
tmp:
  sizeLimit: 64Mi

# UID/GID 1000 wie im Dockerfile
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

istio:
  gatewayName: kubeevent-gw
  # Namespace des Ingress-Gateway-Pods, dort liegt auch das TLS-Secret
  gatewayNamespace: "istio-ingress"
  # Labels des Ingress-Gateway-Pods
  gatewaySelector:
    istio: ingressgateway
  # Hosts für Gateway, VirtualService und Zertifikat
  hosts:
    - kubeevent.tp.lan
    - kubeevent.gmk.lan
  # HTTPS-Server im Gateway, Secret aus cert-manager oder von Hand angelegt
  tls:
    enabled: true
    secretName: kubeevent-tls

# Erzeugt das TLS-Secret, nur wirksam mit istio.tls.enabled
certManager:
  enabled: true
  issuerRef:
    kind: ClusterIssuer
    name: "local-ca-issuer"

# HTTP Basic Auth für UI und API (BASIC_AUTH_USER, BASIC_AUTH_PASSWORD_HASH).
# /healthz, /readyz und /metrics bleiben offen, Probes und Prometheus brauchen keine Zugangsdaten.
basicAuth:
  enabled: false
  username: admin
  # bcrypt-Hash, erzeugt mit "uv run python -m kubeevents.auth" oder "htpasswd -nbBC 12 admin <passwort>"
  # (Teil nach "admin:"). Besser per --set-string oder eigener Values-Datei setzen, nicht einchecken.
  passwordHash: ""
  # Vorhandenes Secret mit den Schlüsseln BASIC_AUTH_USER und BASIC_AUTH_PASSWORD_HASH.
  # Ist es gesetzt, legt das Chart kein eigenes Secret an und ignoriert username und passwordHash.
  existingSecret: ""

serviceAccount:
  create: true
  name: kubeeventspy

# Role und RoleBinding pro Namespace in watchNamespaces, auch für einen fremden ServiceAccount
rbac:
  create: true

# Namespaces, deren Events gelesen werden: RBAC-Rollen und WATCH_NAMESPACES der App
watchNamespaces:
  - kubeevent
  - simpleservice
  - randomfail

# Einstellungen der App, landen als Environment-Variablen in der ConfigMap.
# DB_PATH kommt aus persistence.mountPath, WATCH_NAMESPACES aus watchNamespaces.
config:
  # Events, die älter sind, löscht der stündliche Retention-Job (RETENTION_DAYS)
  retentionDays: 7
  # Metrik-Zeitreihen ohne neues Event in diesem Zeitraum verschwinden aus /metrics (METRICS_SERIES_TTL_HOURS)
  metricsSeriesTtlHours: 24
  # Puffer zwischen Watchern und DB-Worker (QUEUE_MAXSIZE)
  queueMaxsize: 10000
  # Größe (max. 2000) und maximale Wartezeit in Sekunden eines Batches im DB-Worker (BATCH_MAX_SIZE, BATCH_MAX_DELAY)
  batchMaxSize: 500
  batchMaxDelay: 0.2
  # Nach dieser Zeit beendet der API-Server einen Watch, der Watcher verbindet sich neu (WATCH_TIMEOUT_SECONDS)
  watchTimeoutSeconds: 300
  # DEBUG, INFO, WARNING oder ERROR (LOG_LEVEL)
  logLevel: INFO
