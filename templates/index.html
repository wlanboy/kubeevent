<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kubernetes Events</title>
    <link rel="stylesheet" href="/static/vendor/pico-2.1.1.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="app-bar">
        <div class="app-bar-inner">
            <a class="brand" href="#stream" aria-label="Kubernetes Events, go to stream">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" fill="currentColor"/>
                    <path d="M9 16h3.2l2-4.6 3.4 9.2 2.2-4.6H23" fill="none" stroke="#fff" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="brand-text">
                    <h1>Kubernetes Events</h1>
                    <small>Cluster event monitor</small>
                </div>
            </a>

            <nav class="tabs">
                <ul role="tablist" aria-label="Views">
                    <li role="presentation"><a href="#stream" id="tab-btn-stream" class="tab" role="tab" data-tab="stream" aria-controls="tab-stream" aria-selected="true">Stream</a></li>
                    <li role="presentation"><a href="#search" id="tab-btn-search" class="tab" role="tab" data-tab="search" aria-controls="tab-search" aria-selected="false" tabindex="-1">Search</a></li>
                    <li role="presentation"><a href="#stats" id="tab-btn-stats" class="tab" role="tab" data-tab="stats" aria-controls="tab-stats" aria-selected="false" tabindex="-1">Stats</a></li>
                </ul>
            </nav>

            <span id="connStatus" class="status" data-state="connecting" role="status">Connecting…</span>
        </div>
    </header>

    <main class="container-fluid">

        <!-- STREAM TAB -->
        <section id="tab-stream" role="tabpanel" aria-labelledby="tab-btn-stream">
            <fieldset role="group" class="toolbar">
                <input id="streamFilter" type="search" aria-label="Filter events"
                    placeholder="Filter (type, reason, message, name, namespace, component, host)">
                <select id="limitSelect" class="limit-select" aria-label="Number of events kept in the stream">
                    <option value="20">20 events</option>
                    <option value="50">50 events</option>
                    <option value="100" selected>100 events</option>
                    <option value="200">200 events</option>
                    <option value="500">500 events</option>
                </select>
                <button id="streamPause" type="button" class="secondary" aria-pressed="false">Pause</button>
                <button id="streamClear" type="button" class="secondary outline">Clear</button>
            </fieldset>

            <p id="streamInfo" class="table-info" aria-live="polite"></p>

            <div class="card table-container">
                <table class="event-table">
                    <thead>
                        <tr>
                            <th scope="col">Last seen</th>
                            <th scope="col">Type</th>
                            <th scope="col">Reason</th>
                            <th scope="col">Message</th>
                            <th scope="col">Object</th>
                        </tr>
                    </thead>
                    <tbody id="streamBody"></tbody>
                </table>
            </div>

            <nav aria-label="Stream pagination">
                <ul id="streamPagination" class="pager"></ul>
            </nav>
        </section>

        <!-- SEARCH TAB -->
        <section id="tab-search" role="tabpanel" aria-labelledby="tab-btn-search" hidden>
            <form id="searchForm" class="card search-card">
                <fieldset role="group" class="toolbar">
                    <input id="searchInput" type="search" aria-label="Search text"
                        placeholder="Search text (message, name, reason, component, host …)">
                    <button id="searchBtn" type="submit">Search</button>
                </fieldset>
                <div class="search-filters">
                    <label>Type
                        <select id="searchType">
                            <option value="">All</option>
                            <option value="Warning">Warning</option>
                            <option value="Normal">Normal</option>
                        </select>
                    </label>
                    <label>Namespace
                        <select id="searchNamespace">
                            <option value="">All</option>
                        </select>
                    </label>
                    <label>Kind
                        <select id="searchKind">
                            <option value="">All</option>
                        </select>
                    </label>
                    <label>Received
                        <select id="searchRange">
                            <option value="">Any time</option>
                            <option value="1">Last hour</option>
                            <option value="6">Last 6 hours</option>
                            <option value="24">Last 24 hours</option>
                            <option value="168">Last 7 days</option>
                        </select>
                    </label>
                    <button id="searchReset" type="button" class="secondary outline">Reset</button>
                </div>
            </form>

            <p id="searchInfo" class="table-info" aria-live="polite"></p>

            <div class="card table-container">
                <table class="event-table">
                    <thead>
                        <tr>
                            <th scope="col">Last seen</th>
                            <th scope="col">Type</th>
                            <th scope="col">Reason</th>
                            <th scope="col">Message</th>
                            <th scope="col">Object</th>
                        </tr>
                    </thead>
                    <tbody id="searchResults"></tbody>
                </table>
            </div>

            <nav aria-label="Search pagination">
                <ul id="searchPagination" class="pager"></ul>
            </nav>
        </section>

        <!-- STATS TAB -->
        <section id="tab-stats" role="tabpanel" aria-labelledby="tab-btn-stats" hidden>
            <div class="card stats-toolbar">
                <label>Time window
                    <select id="statsRange">
                        <option value="1">Last hour</option>
                        <option value="6">Last 6 hours</option>
                        <option value="24" selected>Last 24 hours</option>
                        <option value="168">Last 7 days</option>
                    </select>
                </label>
                <button id="statsRefresh" type="button" class="secondary outline">Refresh</button>
                <small id="statsUpdated" class="muted" aria-live="polite"></small>
            </div>
            <div id="statsContent"></div>
        </section>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
